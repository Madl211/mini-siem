<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Mini-SIEM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mini-SIEM</h1>
    <nav>
      <button data-view="dashboard" class="nav-btn active">Dashboard</button>
      <button data-view="alerts" class="nav-btn">Alerts</button>
      <button data-view="events" class="nav-btn">Events</button>
      <button data-view="timeline" class="nav-btn">Timeline</button>
      <button data-view="upload" class="nav-btn">Log-Upload</button>
    </nav>
  </header>

  <main>
    <section id="view-dashboard" class="view">
      <h2>Dashboard</h2>
      <div id="stats-cards" class="cards"></div>
      <h3>most frequent Alert types</h3>
      <ul id="top-alert-types"></ul>
    </section>

    <section id="view-alerts" class="view hidden">
      <h2>Alerts</h2>
      <div class="filters">
        <select id="alert-severity">
          <option value="">All Severities</option>
          <option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option>
        </select>
        <select id="alert-status">
          <option value="">All Statuses</option>
          <option>OPEN</option><option>ACKNOWLEDGED</option><option>RESOLVED</option>
        </select>
        <input id="alert-ip" type="text" placeholder="Source IP" />
        <input id="alert-search" type="text" placeholder="Search in Title/Description" />
        <button id="alert-filter-btn">Filter</button>
        <a id="export-alerts-json" href="/api/export/json?dataset=alerts">Export JSON</a>
        <a id="export-alerts-csv" href="/api/export/csv?dataset=alerts">Export CSV</a>
      </div>
      <table id="alerts-table">
        <thead>
          <tr><th>Severity</th><th>Alert-Typ</th><th>Titel</th><th>Quell-IP</th><th>Zeitpunkt</th><th>Status</th><th>Aktionen</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-events" class="view hidden">
      <h2>Events</h2>
      <div class="filters">
        <input id="event-ip" type="text" placeholder="Source IP" />
        <input id="event-type" type="text" placeholder="Event Type" />
        <input id="event-user" type="text" placeholder="Username" />
        <input id="event-path" type="text" placeholder="Path" />
        <button id="event-filter-btn">Filter</button>
        <a id="export-events-json" href="/api/export/json?dataset=events">Export JSON</a>
        <a id="export-events-csv" href="/api/export/csv?dataset=events">Export CSV</a>
      </div>
      <table id="events-table">
        <thead>
          <tr><th>Timestamp</th><th>IP</th><th>Event Type</th><th>User</th><th>Method</th><th>Path</th><th>Status</th><th>Severity</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-timeline" class="view hidden">
      <h2>Timeline</h2>
      <ul id="timeline-list"></ul>
    </section>

    <section id="view-upload" class="view hidden">
      <h2>Log-Upload</h2>
      <form id="upload-form">
        <input type="file" id="upload-file" required />
        <label><input type="radio" name="log_type" value="auto" checked /> Automatic Detection</label>
        <label><input type="radio" name="log_type" value="ssh" /> SSH Log</label>
        <label><input type="radio" name="log_type" value="http" /> HTTP Log</label>
        <button type="submit">Upload &amp; Analyse</button>
      </form>
      <pre id="upload-result"></pre>
    </section>
  </main>

  <div id="alert-detail-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close">Close</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
